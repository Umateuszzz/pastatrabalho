<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moment - Detalhes do Produto</title>
  <link rel="stylesheet" href="style.css">
  <!-- SDK do Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    /* Estilo para quando o tamanho está selecionado */
    .btn-size.selecionado {
      background-color: #000;
      color: #fff;
      border-color: #000;
    }
  </style>
</head>
<body>
    <div class="page-container product-page">

        <h1 class="product-logo">
            moment
        </h1>

        <div class="product-layout">

            <div class="product-image-card">
                <span id="view-badge" class="view-badge">Frente</span>

                <div class="image-wrapper">
                    <img
                        id="product-img"
                        class="product-img"
                        src=""
                        alt="Foto da Camisa"
                    />
                </div>

                <button
                    id="btn-toggle-img"
                    class="btn-toggle-floating"
                    type="button"
                    aria-label="Alternar vista da imagem"
                >
                    <svg
                        width="10"
                        height="16"
                        viewBox="0 0 7 12"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                    >
                        <path
                            d="M1 11L6 6L1 1"
                            stroke="#1E1E1E"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />
                    </svg>
                </button>
            </div>

            <div class="product-details">

                <h3 id="product-name" class="product-name">
                    Carregando...
                </h3>

                <div class="product-price-row">
                    <h3 id="product-price" class="product-price">
                        R$ 0,00
                    </h3>

                    <h3 id="product-installments" class="product-installments">
                        ou 3x de R$ 0,00
                    </h3>
                </div>

                <div class="product-divider">
                    <svg
                        viewBox="0 0 669 1"
                        preserveAspectRatio="none"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                    >
                        <path
                            d="M0 0.5H669"
                            stroke="black"
                        />
                    </svg>
                </div>

                <h3 class="shipping-info">
                    Frete grátis a partir de R$ 299,00
                </h3>

                <div class="size-section">

                    <h3 class="size-title">
                        tamanho:
                        <span id="selected-size-text"></span>
                    </h3>

                    <div id="sizes-container" class="sizes-container">

                        <button
                            type="button"
                            class="btn-size"
                            data-size="P"
                        >
                            P
                        </button>

                        <button
                            type="button"
                            class="btn-size"
                            data-size="M"
                        >
                            M
                        </button>

                        <button
                            type="button"
                            class="btn-size"
                            data-size="G"
                        >
                            G
                        </button>

                        <button
                            type="button"
                            class="btn-size"
                            data-size="GG"
                        >
                            GG
                        </button>

                    </div>

                    <p id="size-warning" class="size-warning">
                        Por favor, selecione um tamanho antes de prosseguir.
                    </p>

                </div>

                <div class="product-actions">

                    <button
                        type="button"
                        id="btn-comprar-agora"
                        class="btn-comprar"
                    >
                        Comprar
                    </button>

                    <button
                        type="button"
                        id="btn-add-carrinho"
                        class="btn-carrinho"
                    >
                        ad. ao carrinho
                    </button>

                </div>

            </div>

        </div>

    </div>

    <script src="checkout/produto.js"></script>
    <script src="checkout/cart.js"></script>
</body>

</html>
</body>


</html>
