<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moment Store - Cadastrar Produto</title>
  
  <link rel="stylesheet" href="admin.css" />
  
  <!-- SDK do Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="admin-container">
    <div class="admin-card">
      <h2>CADASTRAR NOVA CAMISA</h2>

      <form id="product-form">
        <!-- Nome do Produto -->
        <div class="form-group">
          <label for="nome">Nome da Camisa</label>
          <input type="text" id="nome" placeholder="Ex: Camisa Moment Oversized" required />
        </div>

        <!-- Preço -->
        <div class="form-group">
          <label for="preco">Preço (R$)</label>
          <input type="number" id="preco" step="0.01" placeholder="Ex: 129.90" required />
        </div>

        <!-- Foto da Frente -->
        <div class="form-group">
          <label for="imagem_frente">Foto da Frente</label>
          <input type="file" id="imagem_frente" accept="image/*" required />
        </div>

        <!-- Foto das Costas -->
        <div class="form-group">
          <label for="imagem_costas">Foto das Costas</label>
          <input type="file" id="imagem_costas" accept="image/*" required />
        </div>

        <!-- Botão de Envio -->
        <button type="submit" id="btn-submit">CADASTRAR PRODUTO</button>

        <!-- Mensagem de Status -->
        <p id="status-message" class="status-message"></p>
      </form>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
